# Configuracoes especificas para ambiente Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/contas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:contas_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:contas_pass}

# Aguardar o banco estar disponivel
spring.datasource.hikari.connection-init-sql=SELECT 1

# Configuracoes de logging para Docker
logging.level.com.contasapagar.contasapi=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

# Server configuration
server.address=0.0.0.0
